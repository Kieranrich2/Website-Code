<!DOCTYPE html>

<html>
<head>
    <title>Loading...</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">

<!-- Preset title and subtitle for homepage -->
<body data-title="Contact Us" data-subtitle="Make an Equiry Today">
<!-- End of preset title and subtitle for homepage --> 

<!-- PLaceholder for the header -->
<div id="headerPlaceholder"></div>
<!-- End of placeholder for the header -->


<main>
    <h3>Contact Us</h3>
    <p>Phone: 07973977962</p>

<!-- Contact Form -->
    <h3>Send us and Enquiry</h3>
    <form id="contactForm">
        <div class="form-group">
            <!-- User enters Email Address -->
            <label for="email">Email Address:</label>
            <input type="email" id="email" required placeholder="Please enter your email address">
        </div>

        <div class="form-group">
            <label for="service">Which service would you like to enquire about?</label>
            <select id="service" required>
                <!-- First drop down Options -->
                <option value="" disabled selected>Select a Service...</option>
                <option value="Hay Making and Bailing">Hay Making and Bailing</option>
                <option value="Soil Preparation">Soil Preparation</option>
                <option value="Pasture Maintenance">Pasture Maintenance</option>
                <option value="Forage Sales">Forage Sales</option>
                <option value="Manure">Manure</option>
                <option value="Trees and Hedges">Trees and Hedges</option>
                <option value="Groundwork & Arena Construction">Groundwork & Arena Construction</option>
                </select>
        </div>

        <!-- Second drop down Options depending on first selection -->
        <div id="subServiceGroup" class="form-group" style="display: none;">
            <label for="subService">Specific Service:</label>
            <select id="subService">
                </select>
        </div>
            <!-- User enters message -->
        <div class="form-group">
            <label for="message">Message:</label>
            <textarea id="message" required placeholder="What can we help you with?"></textarea>
        </div>

        <button type="submit" id="submitBtn">Submit Enquiry</button>
        <div id="formStatus"></div>
    </form>


<!-- End of Contact Form -->
    <h3>Where to Find Us</h3>
    <p></p>
    <section class="googleMaps">

    </section>
</main>
